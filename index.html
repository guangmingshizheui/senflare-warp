    <script>
    /* 动态主题色：与管理后台调色盘共用 localStorage['theme-color']，首帧前注入避免闪色 */
    (function () {
        var saved = '';
        try { saved = localStorage.getItem('theme-color') || ''; } catch (e) {}
        var m = /^#?([0-9a-fA-F]{6})$/.exec(saved);
        if (!m) return;
        var hex = '#' + m[1];
        var r = parseInt(hex.slice(1, 3), 16) / 255;
        var g = parseInt(hex.slice(3, 5), 16) / 255;
        var b = parseInt(hex.slice(5, 7), 16) / 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var h = 0, s = 0, l = (max + min) / 2;
        if (max !== min) {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
        }
        var root = document.documentElement;
        var rgbStr = Math.round(r * 255) + ', ' + Math.round(g * 255) + ', ' + Math.round(b * 255);
        root.style.setProperty('--landing-rgb', rgbStr);
        root.style.setProperty('--color-primary-rgb', rgbStr);
        root.style.setProperty('--color-primary', hex);
        root.style.setProperty('--color-primary-light', 'hsl(' + Math.round(h) + ', ' + Math.round(s * 100) + '%, ' + Math.min(Math.round(l * 100) + 15, 90) + '%)');
        root.style.setProperty('--color-primary-dark', 'hsl(' + Math.round(h) + ', ' + Math.round(s * 100) + '%, ' + Math.max(Math.round(l * 100) - 6, 20) + '%)');
    })();
    </script>
